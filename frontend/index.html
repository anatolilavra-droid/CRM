<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimal CRM for managing clients and deals." />
    <meta property="og:title" content="CRM" />
    <meta property="og:description" content="A minimal CRM for managing clients and deals." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232563eb'/%3E%3Cpath d='M25 52l18 18 32-38' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <title>CRM — Sign in</title>
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card auth-card">
        <div class="auth-brand"><span class="logo-dot"></span>CRM</div>

        <div class="auth-tabs">
          <button type="button" class="auth-tab active" data-tab="login">Log in</button>
          <button type="button" class="auth-tab" data-tab="register">Sign up</button>
        </div>

        <div class="auth-error" id="auth-error"></div>

        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
        </form>

        <form id="register-form" style="display: none">
          <div class="field">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" required minlength="8" autocomplete="new-password" />
            <div class="field-error">Minimum 8 characters</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="register-submit">Create account</button>
        </form>
      </div>
    </div>

    <script type="module" src="auth.js"></script>
  </body>
</html>
