<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage your CRM clients." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232563eb'/%3E%3Cpath d='M25 52l18 18 32-38' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <title>Clients — CRM</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="topbar"></header>

      <main class="main">
        <div class="page-header">
          <div>
            <h1>Clients</h1>
            <p class="subtitle">Everyone you're currently working with.</p>
          </div>
          <button class="btn btn-primary" id="new-client-btn">+ New client</button>
        </div>

        <div id="clients-container">
          <div class="loading-state">Loading clients…</div>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="client-modal">
      <div class="card modal">
        <div class="modal-header">
          <h2 id="client-modal-title">New client</h2>
          <button class="modal-close" id="client-modal-close">&times;</button>
        </div>
        <form id="client-form">
          <input type="hidden" id="client-id" />
          <div class="field">
            <label for="client-name">Name *</label>
            <input type="text" id="client-name" required />
          </div>
          <div class="field">
            <label for="client-email">Email</label>
            <input type="email" id="client-email" />
          </div>
          <div class="field">
            <label for="client-phone">Phone</label>
            <input type="text" id="client-phone" />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="client-cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="client-save-btn">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="clients.js"></script>
  </body>
</html>
