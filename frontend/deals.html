<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track deals across your CRM pipeline." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%232563eb'/%3E%3Cpath d='M25 52l18 18 32-38' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <title>Deals — CRM</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar" id="topbar"></header>

      <main class="main">
        <div class="page-header">
          <div>
            <h1>Deals</h1>
            <p class="subtitle" id="deals-subtitle">Your full pipeline.</p>
          </div>
          <button class="btn btn-primary" id="new-deal-btn">+ New deal</button>
        </div>

        <div id="deals-container">
          <div class="loading-state">Loading deals…</div>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="deal-modal">
      <div class="card modal">
        <div class="modal-header">
          <h2>New deal</h2>
          <button class="modal-close" id="deal-modal-close">&times;</button>
        </div>
        <form id="deal-form">
          <div class="field">
            <label for="deal-client">Client *</label>
            <select id="deal-client" required></select>
          </div>
          <div class="field">
            <label for="deal-title">Title *</label>
            <input type="text" id="deal-title" required />
          </div>
          <div class="field">
            <label for="deal-amount">Amount</label>
            <input type="number" id="deal-amount" step="0.01" min="0" />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="deal-cancel-btn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="deal-save-btn">Create deal</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="deals.js"></script>
  </body>
</html>
